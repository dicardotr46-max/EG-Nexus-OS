name: EG Nexus OS v6.0 - Auto Audit & Signed APK Factory

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # اجرای خودکار هر ۶ ساعت یک‌بار برای ممیزی سلامت کد و صحت بیلد (بدون انتشار ریلیز)
    - cron: '0 */6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: 3. Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: 4. Verify Cryptographic Mirror Parity (Root vs www)
        run: |
          echo "🔍 Checking Root and www/ mirror byte parity..."
          diff -q index.html www/index.html
          diff -q sw.js www/sw.js
          diff -q manifest.json www/manifest.json
          diff -rq src www/src
          echo "✅ Root and www/ mirrors are 100% byte-for-byte identical."

      - name: 5. Automated Code & Syntax Integrity Audit
        run: |
          echo "🔍 شروع ممیزی خودکار یکپارچگی سینتکس EG Nexus OS v6.0..."
          if [ ! -f "index.html" ]; then
            echo "❌ خطا: فایل index.html یافت نشد!"
            exit 1
          fi
          npm ci
          npm run test:syntax

      - name: 6. Automated Jest Suite & Coverage Gate
        run: |
          echo "🧪 Running full Jest test suite with coverage thresholds..."
          npm test -- --coverage --coverageReporters="json-summary" --coverageReporters="text"

      - name: 7. Static Code Inventory & Architecture Audits
        run: |
          echo "🔍 Running Python static audit and integration test harness..."
          python3 full_app_audit.py
          python3 test_full_app_audit.py

      - name: 8. Supply Chain Dependency Security Audit
        run: |
          echo "🔒 Verifying zero supply chain vulnerabilities..."
          npm audit --audit-level=high

  build-and-sign-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: audit-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: 3. Setup Java JDK 21 (Required for Android Gradle)
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Accept Android SDK Licenses Automatically
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Prepare Clean Capacitor Environment & Web Assets
        run: |
          mkdir -p build_workspace/www
          cp index.html build_workspace/www/
          [ -f manifest.json ] && cp manifest.json build_workspace/www/
          [ -f sw.js ] && cp sw.js build_workspace/www/
          [ -d src ] && cp -r src build_workspace/www/
          # Use authoritative capacitor.config.json with cleartext & loopback support
          cp capacitor.config.json package.json package-lock.json build_workspace/
          cd build_workspace
          npm ci

      - name: 6. Prepare Android Project
        run: |
          cd build_workspace
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          # Sync native android source tree and plugins from repository
          if [ -d "../android" ]; then
            mkdir -p android
            cp -r ../android/* android/
          fi
          npx cap sync android

      - name: 7. Cache Gradle Packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('build_workspace/android/**/*.gradle*', 'build_workspace/android/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 8. Compile Android Release APK
        run: |
          cd build_workspace/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 9. Sign and Verify Release APK with Persistent Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="release.keystore"
          ALIGNED_APK="dist/temp-aligned.apk"
          trap 'shred -u "$KEYSTORE_FILE" 2>/dev/null || rm -f "$KEYSTORE_FILE"; rm -f "$ALIGNED_APK"' EXIT

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"

          RELEASE_DIR="build_workspace/android/app/build/outputs/apk/release"
          UNSIGNED_APK=$(find "$RELEASE_DIR" -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "❌ Error: Release APK not found in $RELEASE_DIR"
            exit 1
          fi
          echo "Found unsigned release APK: $UNSIGNED_APK"

          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "❌ ERROR: Persistent ANDROID_KEYSTORE_BASE64 secret is required for production release signing."
            exit 1
          fi

          echo "🔑 Decoding persistent repository release keystore from environment..."
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"

          mkdir -p dist
          SIGNED_APK="dist/EG-Nexus-OS-v6.1-release-signed.apk"

          if $BUILD_TOOLS_DIR/zipalign -c -v 4 "$UNSIGNED_APK" >/dev/null 2>&1; then
            echo "APK is already 4-byte zipaligned."
            cp "$UNSIGNED_APK" "$ALIGNED_APK"
          else
            echo "Running zipalign on unsigned APK..."
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          fi

          echo "Signing APK with apksigner (v1, v2, v3 schemes)..."
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          echo "Verifying signed APK integrity and signature schemes..."
          $BUILD_TOOLS_DIR/apksigner verify --verbose "$SIGNED_APK"
          echo "✅ Release APK signing and verification completed successfully."

      - name: 10. Upload Ready-to-Install Signed Android APK
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: EG-Nexus-OS-v6.1-Signed-APK
          path: dist/EG-Nexus-OS-v6.1-release-signed.apk
          retention-days: 30

  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-sign-apk
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: 2. Download Built Signed APK Artifact
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: EG-Nexus-OS-v6.1-Signed-APK

      - name: 3. Prepare APK, Checksum and SBOM Provenance
        run: |
          mkdir -p dist
          cp EG-Nexus-OS-v6.1-release-signed.apk EG-Nexus-OS-v6.1.apk
          sha256sum EG-Nexus-OS-v6.1.apk > EG-Nexus-OS-v6.1.apk.sha256
          APK_SHA256=$(awk '{print $1}' EG-Nexus-OS-v6.1.apk.sha256)
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RELEASE_TAG="v6.1.0-${SHORT_SHA}"
          echo "APK_SHA256=${APK_SHA256}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

          cat <<EOF > dist/sbom-provenance.json
          {
            "format": "Nexus-Provenance-v1",
            "releaseTag": "${RELEASE_TAG}",
            "commitSha": "${GITHUB_SHA}",
            "timestamp": "${BUILD_TIMESTAMP}",
            "artifacts": {
              "apk": {
                "name": "EG-Nexus-OS-v6.1.apk",
                "sha256": "${APK_SHA256}"
              }
            },
            "buildEnvironment": {
              "os": "ubuntu-latest",
              "node": "24",
              "java": "21",
              "capacitor": "8.6.0"
            }
          }
          EOF

          echo "📦 Generating CycloneDX v1.5 SBOM from package-lock.json..."
          node scripts/generate-cyclonedx-sbom.js

      - name: 4. Update Git Tags for Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Immutable release tag: check if already exists on remote
          EXISTING_TAG_SHA=$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')
          if [ -n "$EXISTING_TAG_SHA" ]; then
            if [ "$EXISTING_TAG_SHA" != "${GITHUB_SHA}" ]; then
              echo "❌ ERROR: Remote tag ${RELEASE_TAG} points to ${EXISTING_TAG_SHA}, not current commit ${GITHUB_SHA}!"
              exit 1
            fi
            echo "Immutable release tag ${RELEASE_TAG} already exists on remote for ${GITHUB_SHA}; skipping tag push."
          else
            git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "${RELEASE_TAG}" || echo "Release tag push completed or managed by softprops release action"
          fi

      - name: 5. Publish APK to GitHub Releases
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "EG Nexus OS v6.1 (${{ env.SHORT_SHA }})"
          make_latest: true
          body: |
            Automated production build from commit ${{ github.sha }} on ${{ github.ref_name }}.

            - **Release Version:** `v6.1.0`
            - **Commit SHA:** `${{ github.sha }}` (`${{ env.SHORT_SHA }}`)
            - **Build Timestamp:** `${{ env.BUILD_TIMESTAMP }}`
            - **SHA-256 Checksum:**
            ```text
            ${{ env.APK_SHA256 }}
            ```

            ### Release Architecture & Tag Roles
            - **Immutable Version Tag (`${{ env.RELEASE_TAG }}`):**
              Serves as a tamper-evident, permanent audit anchor frozen to commit `${{ github.sha }}`. Guarantees immutable provenance, rollback reproducibility, and verifiable Software Bill of Materials (SBOM) lineage.
          files: |
            EG-Nexus-OS-v6.1.apk
            EG-Nexus-OS-v6.1.apk.sha256
            dist/sbom-provenance.json
            dist/sbom.cdx.json
