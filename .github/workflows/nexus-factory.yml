name: EG Nexus OS v5.1 - Auto Audit & APK Factory

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # اجرای خودکار هر ۶ ساعت یک‌بار برای بررسی سلامت کد
    - cron: '0 */6 * * *'

jobs:
  audit-and-build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup Java JDK 21 (Required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Accept Android SDK Licenses Automatically
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Automated Code & Syntax Integrity Audit
        run: |
          echo "🔍 شروع ممیزی خودکار یکپارچگی EG Nexus OS v5.1..."
          if [ ! -f "index.html" ]; then
            echo "❌ خطا: فایل index.html یافت نشد!"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const scriptRegex = /<script\b[^>]*>([\s\S]*?)<\/script>/gm;
            let match, count = 0, errors = 0;
            while ((match = scriptRegex.exec(html)) !== null) {
              const code = match[1].trim();
              if (code.length > 0) {
                count++;
                try {
                  new Function(code);
                } catch (e) {
                  console.warn("⚠️ هشدار سینتکس در بلوک اسکریپت شماره " + count + ":", e.message);
                }
              }
            }
            console.log("✅ ممیزی کد به پایان رسید. تعداد بلوک‌های اسکریپت بررسی‌شده:", count);
          '

      - name: 6. Prepare Clean Capacitor Environment & Web Assets
        run: |
          mkdir -p build_workspace/www
          cp index.html build_workspace/www/
          [ -f manifest.json ] && cp manifest.json build_workspace/www/ || true
          [ -f sw.js ] && cp sw.js build_workspace/www/ || true
          cd build_workspace
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.egnexus.os",
            "appName": "EG Nexus OS",
            "webDir": "www"
          }
          EOF

      - name: 7. Compile Android APK
        run: |
          cd build_workspace
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Ready-to-Install Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EG-Nexus-OS-v5.1-Debug-APK
          path: build_workspace/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
