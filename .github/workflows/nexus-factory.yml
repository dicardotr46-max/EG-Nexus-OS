name: EG Nexus OS v5.1 - Auto Audit & APK Factory

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # اجرای خودکار هر ۶ ساعت یک‌بار برای بررسی سلامت کد
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  audit-and-build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup Java JDK 21 (Required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Accept Android SDK Licenses Automatically
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Automated Code & Syntax Integrity Audit & Mandatory Jest Gate
        run: |
          echo "🔍 شروع ممیزی خودکار یکپارچگی EG Nexus OS v5.1..."
          if [ ! -f "index.html" ]; then
            echo "❌ خطا: فایل index.html یافت نشد!"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const scriptRegex = /<script\b[^>]*>([\s\S]*?)<\/script>/gm;
            let match, count = 0, errors = 0;
            while ((match = scriptRegex.exec(html)) !== null) {
              const code = match[1].trim();
              if (code.length > 0) {
                count++;
                try {
                  new Function(code);
                } catch (e) {
                  errors++;
                  console.error("❌ خطای سینتکس در بلوک اسکریپت شماره " + count + ":", e.message);
                }
              }
            }
            console.log("✅ ممیزی کد به پایان رسید. تعداد بلوک‌ها:", count, "تعداد خطاها:", errors);
            if (errors > 0) {
              console.error("❌ ممیزی ناموفق: خطاهای سینتکس یافت شدند!");
              process.exit(1);
            }
          '
          if [ -f "package.json" ]; then
            npm install
            npm run test:syntax
            npm test
          fi

      - name: 6. Prepare Clean Capacitor Environment & Web Assets
        run: |
          mkdir -p build_workspace/www
          cp index.html build_workspace/www/
          [ -f manifest.json ] && cp manifest.json build_workspace/www/ || true
          [ -f sw.js ] && cp sw.js build_workspace/www/ || true
          # Use authoritative capacitor.config.json with cleartext & loopback support (Fixes Reviewer #15 & #16)
          cp capacitor.config.json build_workspace/
          cd build_workspace
          npm init -y
          npm install --save-exact @capacitor/core@8.5.3 @capacitor/cli@8.5.3 @capacitor/android@8.5.3 @capacitor/app@8.0.0 @capacitor/browser@8.0.0 @capacitor/filesystem@8.0.0 @capacitor/share@8.0.0

      - name: 7. Compile Android APK
        run: |
          cd build_workspace
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Ready-to-Install Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EG-Nexus-OS-v5.1-Debug-APK
          path: build_workspace/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 9. Copy APK for Release
        run: cp build_workspace/android/app/build/outputs/apk/debug/app-debug.apk EG-Nexus-OS-v5.1.apk

      - name: 9.5. Update Git Tag to Current Commit
        run: |
          git tag -f latest-apk ${{ github.sha }}
          git push -f origin latest-apk || true

      - name: 10. Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          target_commitish: ${{ github.sha }}
          name: "EG Nexus OS v5.1"
          body: "Automated production build from commit ${{ github.sha }} on ${{ github.ref_name }}."
          files: EG-Nexus-OS-v5.1.apk
