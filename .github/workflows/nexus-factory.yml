name: EG Nexus OS v5.2 - Auto Audit & APK Factory

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # اجرای خودکار هر ۶ ساعت یک‌بار برای بررسی سلامت کد
    - cron: '0 */6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit-and-build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'

      - name: 3. Setup Java JDK 21 (Required for Android Gradle)
        uses: actions/setup-java@v4.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Accept Android SDK Licenses Automatically
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 5. Automated Code & Syntax Integrity Audit & Mandatory Jest Gate
        run: |
          echo "🔍 شروع ممیزی خودکار یکپارچگی EG Nexus OS v5.2..."
          if [ ! -f "index.html" ]; then
            echo "❌ خطا: فایل index.html یافت نشد!"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const scriptRegex = /<script\b[^>]*>([\s\S]*?)<\/script>/gm;
            let match, count = 0, errors = 0;
            while ((match = scriptRegex.exec(html)) !== null) {
              const code = match[1].trim();
              if (code.length > 0) {
                count++;
                try {
                  new Function(code);
                } catch (e) {
                  errors++;
                  console.error("❌ خطای سینتکس در بلوک اسکریپت شماره " + count + ":", e.message);
                }
              }
            }
            console.log("✅ ممیزی کد به پایان رسید. تعداد بلوک‌ها:", count, "تعداد خطاها:", errors);
            if (errors > 0) {
              console.error("❌ ممیزی ناموفق: خطاهای سینتکس یافت شدند!");
              process.exit(1);
            }
          '
          if [ -f "package.json" ]; then
            npm ci
            npm run test:syntax
            npm test
          fi

      - name: 6. Prepare Clean Capacitor Environment & Web Assets
        run: |
          mkdir -p build_workspace/www
          cp index.html build_workspace/www/
          [ -f manifest.json ] && cp manifest.json build_workspace/www/
          [ -f sw.js ] && cp sw.js build_workspace/www/
          # Use authoritative capacitor.config.json with cleartext & loopback support (Fixes Reviewer #15 & #16)
          cp capacitor.config.json package.json package-lock.json build_workspace/
          cd build_workspace
          npm ci

      - name: 7. Compile Android APK
        run: |
          cd build_workspace
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload Ready-to-Install Android APK
        uses: actions/upload-artifact@v4.6.1
        with:
          name: EG-Nexus-OS-v5.2-Debug-APK
          path: build_workspace/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  publish-release:
    runs-on: ubuntu-latest
    needs: audit-and-build-apk
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: 2. Download Built APK Artifact
        uses: actions/download-artifact@v4.1.9
        with:
          name: EG-Nexus-OS-v5.2-Debug-APK

      - name: 3. Prepare APK and Checksum for Release
        run: |
          cp app-debug.apk EG-Nexus-OS-v5.2.apk
          sha256sum EG-Nexus-OS-v5.2.apk > EG-Nexus-OS-v5.2.apk.sha256
          APK_SHA256=$(awk '{print $1}' EG-Nexus-OS-v5.2.apk.sha256)
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "APK_SHA256=${APK_SHA256}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=${BUILD_TIMESTAMP}" >> $GITHUB_ENV
          echo "RELEASE_TAG=v5.2-${SHORT_SHA}" >> $GITHUB_ENV

      - name: 4. Update Git Tags for Release
        run: |
          git tag -f latest-apk ${{ github.sha }}
          git tag -f "${RELEASE_TAG}" ${{ github.sha }}
          git push -f origin latest-apk
          git push -f origin "${RELEASE_TAG}"

      - name: 5. Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "EG Nexus OS v5.2 (${{ env.SHORT_SHA }})"
          body: |
            Automated production build from commit ${{ github.sha }} on ${{ github.ref_name }}.

            - **Commit SHA:** `${{ github.sha }}` (`${{ env.SHORT_SHA }}`)
            - **Build Timestamp:** `${{ env.BUILD_TIMESTAMP }}`
            - **SHA-256 Checksum:**
            `${{ env.APK_SHA256 }}`
          files: |
            EG-Nexus-OS-v5.2.apk
            EG-Nexus-OS-v5.2.apk.sha256
